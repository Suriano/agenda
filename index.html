<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Carrinho de Compras</title>
    <!-- Vinculando o CSS -->
    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

    <header>
        <h1>Minha Loja Virtual</h1>
        <div id="carrinho-icone">🛒 Carrinho (<span id="contador-carrinho">0</span>)</div>
    </header>

    <main class="container">
        <!-- Vitrine de Produtos -->
        <section class="produtos">
            <h2>Produtos</h2>
            
            <!-- Exemplo de como deve ficar cada produto no HTML -->
<div class="produto" data-id="1" data-nome="Camiseta HTML" data-preco="49.90" data-img="img/3.jpg">
    <img src="img/3.jpg" alt="Camiseta HTML" class="produto-img">
    <div class="produto-info">
        <h3>Camiseta HTML</h3>
        <p>R$ 49,90</p>
    </div>
    <button class="btn-comprar">Comprar</button>
</div>

            <!-- Produto 2 -->
            <!-- Exemplo de como deve ficar cada produto no HTML -->
<div class="produto" data-id="1" data-nome="Camiseta HTML" data-preco="49.90" data-img="img/2.jpg">
    <img src="img/2.jpg" alt="Camiseta HTML" class="produto-img">
    <div class="produto-info">
        <h3>Camiseta HTML</h3>
        <p>R$ 49,90</p>
    </div>
    <button class="btn-comprar">Comprar</button>
</div>
        </section>

        <!-- Carrinho de Compras -->
        <section class="carrinho">
            <h2>Seu Carrinho</h2>
            <ul id="lista-carrinho">
                <!-- Os itens adicionados aparecerão aqui via JavaScript -->
            </ul>
            <div class="total">
                <p>Total: R$ <span id="valor-total">0.00</span></p>
            </div>
            <button id="btn-finalizar">Finalizar Compra</button>
        </section>
    </main>

    <!-- Vinculando o JavaScript no final da página -->
    <script src="script.js"></script>
</body>
</html>
